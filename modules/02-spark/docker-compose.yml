services:
  spark-master:
    image: apache/spark:4.0.2
    container_name: spark-master
    command: >
      bash -c "/opt/spark/sbin/start-master.sh && tail -f /opt/spark/logs/*"
    environment:
      - SPARK_MASTER_HOST=spark-master
    ports:
      - "8080:8080"   # Master UI
      - "7077:7077"   # Master RPC
      - "4040:4040"   # Application UI
    volumes:
      - .:/app
      - ../../datasets:/datasets

  spark-worker-1:
    image: apache/spark:4.0.2
    container_name: spark-worker-1
    command: >
      bash -c "/opt/spark/sbin/start-worker.sh spark://spark-master:7077 && tail -f /opt/spark/logs/*"
    environment:
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=2
    ports:
      - "8081:8081"
    depends_on:
      - spark-master

  spark-worker-2:
    image: apache/spark:4.0.2
    container_name: spark-worker-2
    command: >
      bash -c "/opt/spark/sbin/start-worker.sh spark://spark-master:7077 && tail -f /opt/spark/logs/*"
    environment:
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=2
    ports:
      - "8082:8081"
    depends_on:
      - spark-master
